name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # Integration with the Editor's pinned VM and Scratch Blocks, on the minimal editor runtime.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
